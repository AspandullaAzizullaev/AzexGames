    *{box-sizing:border-box}
    :root{
      --bg:#06101a;
      --bg2:#0b1627;
      --card:#0f1d35;
      --line:rgba(255,255,255,.08);
      --text:#eef4ff;
      --muted:#9aa8bf;
      --accent:#5b8cff;
      --accent2:#8b5cff;
      --radius:22px;
      --shadow:0 18px 50px rgba(0,0,0,.28);
    }
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(91,140,255,.18), transparent 28%),
        radial-gradient(circle at top right, rgba(139,92,255,.16), transparent 24%),
        linear-gradient(180deg, #040812 0%, var(--bg) 55%, #071018 100%);
      min-height:100vh;
      overflow-x:hidden;
    }
    img{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    button,input,select{font:inherit}

    header{
      position:sticky;
      top:0;
      z-index:20;
      backdrop-filter:blur(18px);
      background:linear-gradient(180deg, rgba(4,8,18,.94), rgba(4,8,18,.72));
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .topbar{
      width:min(1400px, calc(100% - 20px));
      margin:0 auto;
      padding:12px 0;
      display:flex;
      align-items:center;
      gap:12px;
    }
    .logo{
      font-size:25px;
      font-weight:900;
      letter-spacing:-.04em;
      color:#fff;
      flex:0 0 auto;
    }
    .logo span{color:var(--accent)}
    .search{
      flex:1;
      min-width:0;
      height:46px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(10,18,31,.84);
      color:var(--text);
      padding:0 16px;
      outline:none;
      box-shadow:0 8px 24px rgba(0,0,0,.12);
    }
    .search::placeholder{color:#8ea0bd}
    .search:focus,.sort:focus,.cat:focus,.btn:focus{
      border-color:rgba(91,140,255,.55);
      box-shadow:0 0 0 4px rgba(91,140,255,.14);
    }

    main{
      width:min(1400px, calc(100% - 20px));
      margin:0 auto;
      padding:14px 0 30px;
    }

    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      margin:0 0 14px;
    }
    .left-tools,.right-tools{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .cat,.sort{
      height:42px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(10,18,31,.84);
      color:var(--text);
      padding:0 14px;
      cursor:pointer;
      transition:.22s ease;
    }
    .cat:hover,.sort:hover{transform:translateY(-1px)}
    .cat.active{
      background:linear-gradient(135deg, var(--accent), var(--accent2));
      border-color:transparent;
      box-shadow:0 12px 28px rgba(91,140,255,.18);
    }

    .section-head{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:12px;
      margin:6px 0 16px;
    }
    .section-head h2{margin:0;font-size:22px}
    #count{margin:4px 0 0;color:var(--muted);font-size:13px}
    .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
    gap: 20px; 
    }

   
    
    .game{
      position:relative;
      border:1px solid rgba(255,255,255,.08);
      border-radius:22px;
      background:linear-gradient(180deg, rgba(15,29,53,.94), rgba(8,15,28,.98));
      color:inherit;
      text-align:left;
      cursor:pointer;
      overflow:hidden;
      padding:12px;
      box-shadow:0 10px 30px rgba(0,0,0,.18);
      transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease, filter .22s ease;
      will-change:transform;
    }
    .game::before{
      content:"";
      position:absolute;
      inset:-1px;
      background:linear-gradient(135deg, rgba(91,140,255,.0), rgba(91,140,255,.18), rgba(139,92,255,.0));
      opacity:0;
      transition:opacity .22s ease;
      pointer-events:none;
    }
    .game:hover{
      transform:translateY(-7px) scale(1.02);
      border-color:rgba(91,140,255,.42);
      box-shadow:0 22px 54px rgba(0,0,0,.38), 0 0 30px rgba(91,140,255,.12);
      filter:saturate(1.05);
    }
    .game:hover::before{opacity:1}
    .cover {
     aspect-ratio: 4 / 3; /* 16/10 dan 4/3 ga o'zgartirildi - rasm balandroq va kattaroq bo'ladi */
     border-radius: 18px;
     background: 
       radial-gradient(circle at 30% 20%, rgba(255,255,255,.10), transparent 28%),
       linear-gradient(135deg, rgba(91,140,255,.18), rgba(139,92,255,.14));
     display: grid;
     place-items: center;
     overflow: hidden;
     position: relative;
     margin-bottom: 12px;
     width: 100%; /* To'liq kenglikni egallashi uchun */
     }

    .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Rasm cho'zilmasdan, qutini to'liq to'ldiradi */
    position: absolute;
    inset: 0;
    transition: transform .3s ease; /* Hoverda effekt uchun */
    }

    /* Rasmga sichqoncha borganda biroz yaqinlashish effekti */
   .game:hover .cover img {
    transform: scale(1.05);
    }

    .emoji{
      font-size:40px;
      transition:transform .22s ease;
      filter:drop-shadow(0 10px 18px rgba(0,0,0,.24));
    }
    .game:hover .emoji{transform:scale(1.08) rotate(-3deg)}
    .game h3 {
    font-size: 17px; /* 15px dan 17px ga */
    margin: 0 0 6px;
    line-height: 1.4;
    min-height: 48px; /* Matnlar tekis turishi uchun balandlik oshirildi */
    }

    .game p {
     margin: 0;
     color: var(--muted);
     font-size: 14px; /* 13px dan 14px ga */
       }

    .empty{
      margin:18px 0 0;
      padding:18px;
      border-radius:18px;
      border:1px dashed rgba(255,255,255,.14);
      color:var(--muted);
      text-align:center;
      background:rgba(255,255,255,.02);
    }

    footer{
      width:min(1400px, calc(100% - 20px));
      margin:0 auto;
      padding:22px 0 28px;
      color:var(--muted);
      text-align:center;
      border-top:1px solid rgba(255,255,255,.06);
    }

    .modal{
      position:fixed;
      inset:0;
      z-index:50;
      background:rgba(3,7,15,.78);
      backdrop-filter:blur(16px);
    }
    .modal[hidden]{display:none}
    .panel{
      width:min(1240px, calc(100% - 18px));
      height:min(92vh, 920px);
      margin:4vh auto 0;
      border-radius:24px;
      overflow:hidden;
      background:linear-gradient(180deg, rgba(11,20,36,.98), rgba(7,13,24,.99));
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 30px 80px rgba(0,0,0,.5);
      display:grid;
      grid-template-rows:auto 1fr auto;
    }
    .bar{
      padding:12px;
      display:flex;
      align-items:center;
      gap:10px;
      border-bottom:1px solid rgba(255,255,255,.07);
    }
    .bar button{
      height:42px;
      padding:0 14px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;
      background:rgba(255,255,255,.04);
      color:var(--text);
      cursor:pointer;
    }
    #gameName{
      flex:1;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .stage{
      min-height:300px;
      background:#000;
    }
    iframe{
      width:100%;
      height:100%;
      border:0;
      background:#000;
    }
    .info{
      padding:16px 18px 18px;
      border-top:1px solid rgba(255,255,255,.07);
    }
    .info h2{margin:0 0 8px;font-size:18px}
    .info p{margin:0;color:var(--muted);line-height:1.6}

      .emoji{font-size:32px}
      .panel{width:100%;height:100vh;margin:0;border-radius:0}
      .stage{min-height:45vh}
      .section-head h2{font-size:19px}
    }
  </style>
</head>

function esc(s){
  return String(s || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function render(){
  const q = search.value.trim().toLowerCase();
  let list = GAMES.filter(g =>
    (category === "All" || g.category === category) &&
    [g.title, g.category, g.description, g.instructions].join(" ").toLowerCase().includes(q)
  );

  const sortVal = select("#sort").value;
  if (sortVal === "az") list.sort((a,b) => a.title.localeCompare(b.title));
  else if (sortVal === "new") list.sort((a,b) => (b.added || "").localeCompare(a.added || ""));
  else list.sort((a,b) => (b.popular || 0) - (a.popular || 0));

  select("#heading").textContent = category === "All" ? "Mashhur o‘yinlar" : category;
  select("#count").textContent = `${list.length} ta o‘yin`;
  select("#empty").hidden = list.length !== 0;
  grid.hidden = list.length === 0;

  grid.innerHTML = list.map(g => `
    <button class="game" data-id="${esc(g.id)}">
      <div class="cover">
        <span class="emoji">${esc(g.icon || "🎮")}</span>
        ${g.thumbnail ? `<img loading="lazy" src="${esc(g.thumbnail)}" alt="${esc(g.title)}" onerror="this.remove()">` : ""}
      </div>
      <h3>${esc(g.title)}</h3>
      <p>${esc(g.category)}</p>
    </button>
  `).join("");
}

function openGame(g){
  let url = g.file;
  const sep = url.includes("?") ? "&" : "?";
  url = url + sep + "pubid=" + MY_PUBLISHER_ID;

  if (blobURL) URL.revokeObjectURL(blobURL);
  blobURL = url.startsWith("blob:") ? url : null;

  select("#gameName").textContent = g.title;
  select("#infoTitle").textContent = g.title;
  select("#infoDesc").textContent = g.description || "";
  select("#infoIns").textContent = g.instructions || "";
  modal.hidden = false;
  document.body.style.overflow = "hidden";
  frame.src = url;
  history.replaceState(null, "", "#game-" + encodeURIComponent(g.id));
}

function closeGame(){
  modal.hidden = true;
  frame.src = "about:blank";
  document.body.style.overflow = "";
  if (blobURL) { URL.revokeObjectURL(blobURL); blobURL = null; }
  if (location.hash.startsWith("#game-")) history.replaceState(null, "", location.pathname + location.search);
}

grid.addEventListener("click", e => {
  const b = e.target.closest("[data-id]");
  if (!b) return;
  const g = GAMES.find(x => x.id === b.dataset.id);
  if (g) openGame(g);
});

search.addEventListener("input", render);
select("#sort").addEventListener("change", render);

select("#categories").addEventListener("click", e => {
  const b = e.target.closest("[data-cat]");
  if (!b) return;
  category = b.dataset.cat;
  document.querySelectorAll(".cat").forEach(x => x.classList.toggle("active", x === b));
  render();
});

select("#back").onclick = closeGame;
select("#close").onclick = closeGame;
select("#full").onclick = async () => {
  try{
    if (!document.fullscreenElement) await frame.requestFullscreen();
    else await document.exitFullscreen();
  } catch {
    alert("Fullscreen ishlamadi");
  }
};

select("#home").onclick = e => {
  e.preventDefault();
  closeGame();
  category = "All";
  search.value = "";
  document.querySelectorAll(".cat").forEach(x => x.classList.toggle("active", x.dataset.cat === "All"));
  render();
  window.scrollTo(0,0);
};

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !modal.hidden) closeGame();
});

select("#year").textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
